[project]
name = "poc-strands-orchestrator"
version = "0.1.0"
description = "Strands Agents orchestrator-workers proof of concept for IT incident response"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "strands-agents[otel]~=1.63",
    "pydantic~=2.11",
    "pydantic-settings~=2.10",
    "fastapi~=0.120",
    "uvicorn[standard]~=0.38",
]

[dependency-groups]
dev = [
    "httpx~=0.28",
    "mypy~=1.18",
    "pytest~=8.4",
    "pytest-asyncio~=1.2",
    "pytest-cov~=7.0",
    "ruff~=0.14",
]

[build-system]
requires = ["hatchling~=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_agent", "src/incident_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S", "PT", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
